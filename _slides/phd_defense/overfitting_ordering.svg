<svg viewBox='5 0 990 420' xmlns='http://www.w3.org/2000/svg'
     style='margin:-0.5em auto 0; width:90%'>
  <defs>
    <marker id='wo-arrow' markerWidth='10' markerHeight='10' markerUnits='strokeWidth'
            refX='3' refY='3' orient='auto' viewBox='0 0 16 16'>
      <path d='M0,0 L0,6 L7,3 z' fill='LightGray' />
    </marker>
    <marker id='wo-arrow-2' markerWidth='10' markerHeight='10' markerUnits='strokeWidth'
            refX='3' refY='3' orient='auto' viewBox='0 0 12 12'>
      <path d='M0,0 L0,6 L7,3 z' fill='SlateGray' />
    </marker>
    <marker id='wo-arrow-3' markerWidth='10' markerHeight='10' markerUnits='strokeWidth'
            refX='3' refY='3' orient='auto' viewBox='0 0 16 16'>
      <path d='M0,0 L0,6 L7,3 z' fill='SteelBlue' />
    </marker>
    <marker id='wo-arrow-4' markerWidth='10' markerHeight='10' markerUnits='strokeWidth'
            refX='3' refY='3' orient='auto' viewBox='0 0 16 16'>
      <path d='M0,0 L0,6 L7,3 z' fill='FireBrick' />
    </marker>
    <pattern id='pattern' x='10' y='-15' width='110' height='50' patternUnits='userSpaceOnUse'>
      <circle cx='55' cy='25' r='8' fill='LightGray' />
    </pattern>
    <pattern id='diagonal-stripes' patternUnits='userSpaceOnUse' width='8' height='8'>
      <path d='M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4'
            stroke='ForestGreen' stroke-width='0.5' opacity='0.5' />
    </pattern>
  </defs>

  <foreignObject x='162' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='162 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.4em;'> $ \mathcal{E}_1 $ </span>
  </foreignObject>
  <foreignObject x='220' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='220 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.2em;'> $ \subseteq $ </span>
  </foreignObject>
  <foreignObject x='272' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='272 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.4em;'> $ \mathcal{E}_2 $ </span>
  </foreignObject>
  <foreignObject x='330' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='330 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.2em;'> $ \subseteq $ </span>
  </foreignObject>
  <foreignObject x='382' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='382 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.4em;'> $ \mathcal{E}_3 $ </span>
  </foreignObject>
  <foreignObject x='440' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='440 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.2em;'> $ \subseteq $ </span>
  </foreignObject>
  <foreignObject x='492' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='492 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.4em;'> $ \mathcal{E}_4 $ </span>
  </foreignObject>
  <foreignObject x='550' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='550 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.2em;'> $ \subseteq $ </span>
  </foreignObject>
  <foreignObject x='602' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='602 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.4em;'> $ \mathcal{E}_5 $ </span>
  </foreignObject>
  <foreignObject x='660' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='660 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.2em;'> $ \subseteq $ </span>
  </foreignObject>
  <foreignObject x='712' y='5' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='712 5'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.4em;'> $ \mathcal{E}_6 $ </span>
  </foreignObject>

  <line x1='20' y1='60' x2='970' y2='60' marker-end='url(#wo-arrow)'
        stroke-linecap='round' stroke='LightGray' stroke-width='4' />
  <text x='790' y='27' transform='scale(0.5)' transform-origin='790 27'
        fill='Olive' class='subheading' font-size='1.6em' dominant-baseline='middle'>
    Grammars
  </text>

  <line x1='64' y1='20' x2='64' y2='390' marker-end='url(#wo-arrow)'
        stroke-linecap='round' stroke='LightGray' stroke-width='4' />
  <text x='30' y='380' transform='scale(0.5) rotate(-90)' transform-origin='30 380'
        fill='Olive' class='subheading' font-size='1.6em' dominant-baseline='middle'>
    Sizes
  </text>

  <line x1='174' y1='48' x2='174' y2='72' stroke='LightGray' stroke-width='4' />
  <line x1='284' y1='48' x2='284' y2='72' stroke='LightGray' stroke-width='4' />
  <line x1='394' y1='48' x2='394' y2='72' stroke='LightGray' stroke-width='4' />
  <line x1='504' y1='48' x2='504' y2='72' stroke='LightGray' stroke-width='4' />
  <line x1='614' y1='48' x2='614' y2='72' stroke='LightGray' stroke-width='4' />
  <line x1='724' y1='48' x2='724' y2='72' stroke='LightGray' stroke-width='4' />

  <line x1='52' y1='110' x2='76' y2='110' stroke='LightGray' stroke-width='4' />
  <line x1='52' y1='160' x2='76' y2='160' stroke='LightGray' stroke-width='4' />
  <line x1='52' y1='210' x2='76' y2='210' stroke='LightGray' stroke-width='4' />
  <line x1='52' y1='260' x2='76' y2='260' stroke='LightGray' stroke-width='4' />

  <foreignObject x='20' y='90' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='20 90'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.6em;'> $ 1 $ </span>
  </foreignObject>
  <foreignObject x='20' y='140' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='20 140'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.6em;'> $ 2 $ </span>
  </foreignObject>
  <foreignObject x='20' y='190' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='20 190'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.6em;'> $ 3 $ </span>
  </foreignObject>
  <foreignObject x='20' y='240' width='10%' height='25%'
                 transform='scale(0.5)' transform-origin='20 240'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.6em;'> $ 4 $ </span>
  </foreignObject>

  <circle cx='724.5' cy='260.25' r='18' fill='DarkMagenta' />

  <polyline points='124,185 500,227.5 520,220.25 559,185'
            fill='ForestGreen' fill-opacity='0.6' stroke='ForestGreen' stroke-width='1'
            class='fragment' data-fragment-index='2' />
  <circle cx='504.5' cy='210.25' r='18' fill='ForestGreen'
          class='fragment' data-fragment-index='2' />

  <rect x='119' y='85' rx='8' width='445' height='100'
        fill='url(#diagonal-stripes)' stroke='ForestGreen' stroke-width='2'
        class='fragment' data-fragment-index='2' />
  <rect x='119' y='85' fill='url(#pattern)' width='700' height='200' />

  <foreignObject x='128' y='290' width='200%' height='75%'
                 transform='scale(0.5)' transform-origin='128 290'
                 class='fragment' data-fragment-index='1'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.3em; width:100%; color:DarkRed'>
      &bull; A path through all the points on this grid
    </span>
  </foreignObject>

  <foreignObject x='128' y='325' width='200%' height='75%'
                 transform='scale(0.5)' transform-origin='128 325'
                 class='fragment' data-fragment-index='1'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.3em; width:100%; color:DarkRed'>
      &bull; Expressions must be enumerated only once
    </span>
  </foreignObject>

  <foreignObject x='128' y='360' width='200%' height='75%'
                 transform='scale(0.5)' transform-origin='128 360'
                 class='fragment' data-fragment-index='2'>
    <span xmlns='http://www.w3.org/1999/xhtml' style='font-size:1.3em; width:100%; color:DarkRed'>
      &bull; An expression must be enumerated <em>after</em> all its subexpressions
    </span>
  </foreignObject>

  <path d='M 870,200 C 870,260 870,260 758,260' fill='none' marker-end='url(#wo-arrow-2)'
        stroke='SlateGray' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' />
  <foreignObject x='765' y='110' width='44%' height='75%'
                 transform='scale(0.5)' transform-origin='765 95'>
    <p xmlns='http://www.w3.org/1999/xhtml' style='width:100%; text-align:justify'>
      Expressions of size $ 4 $ that appear only in $ \mathcal{E}_6 $,
      but not in $ \mathcal{E}_1, \ldots, \mathcal{E}_5$
    </p>
  </foreignObject>
</svg>